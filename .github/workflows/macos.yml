# 他人の Mac で README どおりに一から入れて動くかを確かめる（GitHub の macOS 実行環境を「別のMac」として使う）。
# 実行環境自身を実測するだけで、個人データは使わない。台帳は examples/ のひな形のまま。
name: macOS fresh install

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 一般の人の入れ方: 評価エンジンなし。Node.js も git も使わず、macOS に入っている python3 だけで動くか
  python-only:
    runs-on: macos-latest
    env:
      PATH: /usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
      - name: No Node.js on PATH
        run: |
          echo "BB_PREFLIGHT_HOME=$RUNNER_TEMP/bb-preflight-home" >> "$GITHUB_ENV"
          if command -v node; then echo 'node should not be on PATH'; exit 1; fi
          /usr/bin/python3 --version
      - name: setup.sh (no engine)
        run: ./setup.sh | tee "$RUNNER_TEMP/setup.log" && grep -q '評価エンジンは入れません' "$RUNNER_TEMP/setup.log" && test ! -e vendor && test ! -e "/Applications/Preflight Diagram.app" && test ! -e "$HOME/Applications/Preflight Diagram.app"
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Launcher, first and second run
        run: |
          /usr/bin/python3 -c "import json,os;p=os.environ['BB_PREFLIGHT_HOME']+'/inventory.json';d=json.load(open(p));d['mac']['label']='CI Mac';json.dump(d,open(p,'w'),ensure_ascii=False)"
          echo | ./Preflight.command | tee "$RUNNER_TEMP/l1.log"
          grep -q 'レポートを開きます' "$RUNNER_TEMP/l1.log"
          sleep 1
          echo | ./Preflight.command | tee "$RUNNER_TEMP/l2.log"
          latest="$(ls -d "$BB_PREFLIGHT_HOME"/out/*/ | sort | tail -1)"
          for f in report.html report.md report.en.md facts.json; do test -s "$latest/$f" || { echo "missing $f"; exit 1; }; done
          test "$(stat -f %Lp "$latest/report.html")" = 600
          grep -q '## 2. 前回との差分' "$latest/report.md"
          if grep -q '## 3. 参考' "$latest/report.md"; then echo 'engine section without engine'; exit 1; fi
          echo "::notice title=python-only::$(sw_vers -productVersion) $(uname -m) $(/usr/bin/python3 --version 2>&1)"

  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]  # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Environment
        run: |
          echo "BB_PREFLIGHT_HOME=$RUNNER_TEMP/bb-preflight-home" >> "$GITHUB_ENV"
          sw_vers
          uname -m
          /usr/bin/python3 --version
          node --version
      - name: Old launchers from v0.9.0 (to be cleaned up by setup.sh)
        run: |
          # v0.9.0 の名前・バンドルIDで、別の場所を指す起動ボタン（フォルダを移したあとの形）を置く
          apps=/Applications; [ -w /Applications ] || apps="$HOME/Applications"
          fake() {
            mkdir -p "$1/Contents/MacOS"
            printf '#!/bin/bash\nTARGET=/old/place/Preflight.command\n' > "$1/Contents/MacOS/launcher"
            printf '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>%s</string></dict></plist>' "$2" > "$1/Contents/Info.plist"
          }
          fake "$apps/Blackbox Blast Preflight.app" com.blackboxblast.preflight
          fake "$apps/Blackbox Blast Preflight Diagram.app" com.blackboxblast.preflight.diagram
          # バンドルIDが違うものは、同じ名前でも残す
          fake "$HOME/Applications/Blackbox Blast Preflight.app" com.example.other
      - name: setup.sh (fetch and build CyberRiskScape, place example inventory)
        run: ./setup.sh --with-engine
      - name: Unit and CLI integration tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: run.sh (first run)
        run: ./run.sh
      - name: run.sh (second run, produces a diff)
        run: ./run.sh
      - name: Launcher placed by setup.sh (double-click path, non-interactive)
        run: |
          # ひな形のままだと台帳を開いて止まる。少し書き換えてから実測の経路を通す
          /usr/bin/python3 -c "import json,os,sys;p=os.environ['BB_PREFLIGHT_HOME']+'/inventory.json';d=json.load(open(p));d['mac']['label']='CI Mac';json.dump(d,open(p,'w'),ensure_ascii=False)"
          # 管理者のユーザー（GitHub の Mac もそう）なら /Applications、そうでなければ ~/Applications に置かれる
          apps=/Applications; [ -w /Applications ] || apps="$HOME/Applications"
          app="$apps/Preflight.app"
          # v0.9.0 の起動ボタンは片付き、ほかのアプリは残る
          test ! -e "$apps/Blackbox Blast Preflight.app"
          test ! -e "$apps/Blackbox Blast Preflight Diagram.app"
          test -e "$HOME/Applications/Blackbox Blast Preflight.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = dev.forestlife.preflight
          plutil -lint "$app/Contents/Info.plist"
          # アプリの版は VERSION ファイルと同じ
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$(tr -d '[:space:]' < VERSION)"
          test -s "$app/Contents/Resources/AppIcon.icns"
          test -x "$app/Contents/MacOS/launcher"
          # 評価エンジンありの Mac には、構成図の起動ボタンも置かれる
          dapp="$apps/Preflight Diagram.app"
          plutil -lint "$dapp/Contents/Info.plist"
          test -s "$dapp/Contents/Resources/AppIcon.icns"
          grep -q 'Diagram.command' "$dapp/Contents/MacOS/launcher"
          # .app はターミナルを開くだけなので、埋め込まれた本体の起動ファイルを直接（対話なしで）実行する
          eval "$(grep '^TARGET=' "$app/Contents/MacOS/launcher")"
          test -x "$TARGET"
          echo | "$TARGET" | tee "$RUNNER_TEMP/launcher.log"
          grep -q 'レポートを開きます' "$RUNNER_TEMP/launcher.log"
      - name: Diagram.command serves the engine's browser app with the latest diagram
        run: |
          test -s vendor/CyberRiskScape/dist/index.html
          BB_PREFLIGHT_NO_BROWSER=1 /usr/bin/python3 diagram.py > "$RUNNER_TEMP/diagram.log" 2>&1 &
          for i in $(seq 30); do grep -q 't=' "$RUNNER_TEMP/diagram.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/diagram.log"
          # 起動ごとの合言葉は、ブラウザで開く URL にだけ載る
          t="$(grep -o 't=[A-Za-z0-9_-]*' "$RUNNER_TEMP/diagram.log" | head -1)"
          test -n "$t"
          curl -fsS http://127.0.0.1:4180/ | grep -qi '<div id="root"'
          curl -fsS "http://127.0.0.1:4180/__preflight/model.json?$t" | /usr/bin/python3 -c "import json,sys; assert json.load(sys.stdin)['layers']['L1']['nodes']"
          curl -fsS "http://127.0.0.1:4180/__preflight/load.html?$t" | grep -q cyberriskscape
          # 合言葉なし、または別のサイトの名前（DNS リバインディング）では断る
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4180/__preflight/model.json)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example:4180' "http://127.0.0.1:4180/__preflight/model.json?$t")" = 403
          kill %1
      - name: Check outputs
        run: |
          latest="$(ls -d "$BB_PREFLIGHT_HOME"/out/*/ | sort | tail -1)"
          for f in report.html report.md ipa-checklist.csv threats.json diff.md facts.json; do
            test -s "$latest/$f" || { echo "missing $f"; exit 1; }
          done
          test "$(stat -f %Lp "$BB_PREFLIGHT_HOME")" = 700
          grep -q '## 2. 前回との差分' "$latest/report.md"
          sed -n '1,40p' "$latest/report.md"
          # 結果の要点を注記として残す（API から読めるように）
          echo "::notice title=env::$(sw_vers -productVersion) $(uname -m) $(/usr/bin/python3 --version 2>&1) node $(node --version) crs $(git -C vendor/CyberRiskScape rev-parse --short HEAD)"
          echo "::notice title=report::$(grep -E '^## [0-9]' "$latest/report.md" | tr '\n' ' ')"
          echo "::notice title=facts::$(grep -m1 '待ち受け:' "$latest/report.md")"
          echo "::notice title=diff::$(grep -E '^#' "$latest/diff.md" | head -3 | tr '\n' ' ')"
          {
            sw_vers; uname -m; /usr/bin/python3 --version; node --version
            git -C vendor/CyberRiskScape rev-parse HEAD
          } > "$RUNNER_TEMP/env.txt"
          cp "$latest/report.md" "$latest/diff.md" "$RUNNER_TEMP/"
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-install-report
          path: |
            ${{ runner.temp }}/env.txt
            ${{ runner.temp }}/report.md
            ${{ runner.temp }}/diff.md
