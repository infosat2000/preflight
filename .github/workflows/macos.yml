# 他人の Mac で README どおりに一から入れて動くかを確かめる（GitHub の macOS 実行環境を「別のMac」として使う）。
# 実行環境自身を実測するだけで、個人データは使わない。台帳は examples/ のひな形のまま。
name: macOS fresh install

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]  # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Environment
        run: |
          echo "BB_PREFLIGHT_HOME=$RUNNER_TEMP/bb-preflight-home" >> "$GITHUB_ENV"
          sw_vers
          uname -m
          /usr/bin/python3 --version
          node --version
      - name: setup.sh (fetch and build CyberRiskScape, place example inventory)
        run: ./setup.sh
      - name: Unit and CLI integration tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: run.sh (first run)
        run: ./run.sh
      - name: run.sh (second run, produces a diff)
        run: ./run.sh
      - name: Preflight.command (double-click launcher, non-interactive)
        run: |
          # ひな形のままだと台帳を開いて止まる。少し書き換えてから実測の経路を通す
          /usr/bin/python3 -c "import json,os,sys;p=os.environ['BB_PREFLIGHT_HOME']+'/inventory.json';d=json.load(open(p));d['mac']['label']='CI Mac';json.dump(d,open(p,'w'),ensure_ascii=False)"
          echo | ./Preflight.command | tee "$RUNNER_TEMP/launcher.log"
          grep -q 'レポートを開きます' "$RUNNER_TEMP/launcher.log"
      - name: Check outputs
        run: |
          latest="$(ls -d "$BB_PREFLIGHT_HOME"/out/*/ | sort | tail -1)"
          for f in report.md ipa-checklist.csv threats.json diff.md facts.json; do
            test -s "$latest/$f" || { echo "missing $f"; exit 1; }
          done
          test "$(stat -f %Lp "$BB_PREFLIGHT_HOME")" = 700
          grep -q '## 2. 前回との差分' "$latest/report.md"
          sed -n '1,40p' "$latest/report.md"
          # 結果の要点を注記として残す（API から読めるように）
          echo "::notice title=env::$(sw_vers -productVersion) $(uname -m) $(/usr/bin/python3 --version 2>&1) node $(node --version) crs $(git -C vendor/CyberRiskScape rev-parse --short HEAD)"
          echo "::notice title=report::$(grep -E '^## [0-9]' "$latest/report.md" | tr '\n' ' ')"
          echo "::notice title=facts::$(grep -m1 '待ち受け:' "$latest/report.md")"
          echo "::notice title=diff::$(grep -E '^#' "$latest/diff.md" | head -3 | tr '\n' ' ')"
          {
            sw_vers; uname -m; /usr/bin/python3 --version; node --version
            git -C vendor/CyberRiskScape rev-parse HEAD
          } > "$RUNNER_TEMP/env.txt"
          cp "$latest/report.md" "$latest/diff.md" "$RUNNER_TEMP/"
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-install-report
          path: |
            ${{ runner.temp }}/env.txt
            ${{ runner.temp }}/report.md
            ${{ runner.temp }}/diff.md
